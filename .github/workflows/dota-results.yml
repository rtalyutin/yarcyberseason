name: Dota 2 results to Timeweb S3

on:
  schedule:
    # 20:00–01:00 Moscow on October 9–10. The script guards exact dates and
    # the October 9 kickoff at 20:30; GitHub schedules may be delayed.
    - cron: '*/5 17-21 9,10 10 *'
  workflow_dispatch:
    inputs:
      probe_old_league:
        description: 'Read one old-league map only, without S3 access or publishing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ycs-dota-results-s3
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Read old league without publishing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_old_league }}
        run: node scripts/dota-results-import.mjs --probe-old-league
      - name: Import confirmed results
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe_old_league) }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YCS_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YCS_S3_SECRET_ACCESS_KEY }}
        run: node scripts/dota-results-import.mjs
