<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ЯКС · рабочие экраны miniapp</title>
<style>
body { margin: 0; background: #11171b; color: #f1eadc; font-family: Arial,sans-serif; }
main { width: max-content; margin: 28px auto; }
header { margin-bottom: 22px; }
header p { color: #42d9ee; font-size: 14px; letter-spacing: .12em; }
h1 { font-size: 30px; margin: 8px 0; }
header span { color: #aeb9bd; font-size: 16px; }
.screens { display: grid; grid-template-columns: repeat(2, var(--qa-width, 390px)); gap: 40px; }
figure { margin: 0; }
figcaption { margin: 0 0 12px; font-size: 14px; color: #aeb9bd; }
iframe { display: block; width: var(--qa-width, 390px); height: 850px; border: 0; outline: 1px solid #39464b; background: #070a0d; }
label { display: block; margin-top: 12px; font-size: 14px; }
</style></head>
<body><main><header><p>ЯРКИБЕРСЕЗОН · MINI APP</p><h1>Разлом. Уже в интерфейсе.</h1><span>Два экрана · реальные данные · без публикации</span><label>Ширина экрана <select onchange="document.documentElement.style.setProperty('--qa-width', this.value + 'px')"><option>360</option><option selected>390</option><option>430</option><option>768</option></select></label></header><div class="screens">
<figure><figcaption>01 · Главная → открыть турнир</figcaption><iframe title="Главная miniapp" src="/tg"></iframe></figure>
<figure><figcaption>02 · Турнир → участники → назад</figcaption><iframe title="Участники miniapp" src="/tg/tournament?section=participants"></iframe></figure>
</div></main></body></html>
